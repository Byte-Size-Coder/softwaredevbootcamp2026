<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <title>Document</title>
  </head>
  <body style="padding: 1rem">
    <h1 class="text-primary text-center mt-2">Hello Bootstrap!</h1>
    <p class="text-center">My First Bootstrap Page</p>
    <div class="text-center my-4">
      <button>Get Started</button>
    </div>

    <div class="container mt-5">
      <div class="row">
        <div class="col-6 bg-primary text-white p-3"></div>
        <div class="col-4 bg-secondary text-white p-3"></div>
        <div class="col-2 bg-accent text-white p-3"></div>
      </div>
    </div>

    <div class="container mt-5">
      <div class="row">
        <div
          class="col-12 md:col-6 lg:col-4 my-bg-primary text-white p-3"
        ></div>
        <div class="col-12 md:col-6 lg:col-4 bg-success text-white p-3"></div>
        <div class="col-12 md:col-6 lg:col-4 bg-danger text-white p-3"></div>
      </div>
    </div>

    <div class="container text-center">
      <div class="row">
        <div class="col-6 col-sm-4">.col-6 .col-sm-4</div>
        <div class="col-6 col-sm-4">.col-6 .col-sm-4</div>
      </div>
    </div>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
